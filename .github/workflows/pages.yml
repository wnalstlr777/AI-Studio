name: Deploy AI Studio dashboard
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'mind/**'
      - 'shared/hina/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node desktop/scripts/validate-asset-manifest.mjs
      - run: node desktop/scripts/validate-asset-manifest.mjs idle-manifest.json
      - uses: actions/configure-pages@v5
      - name: Stage committed site files
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/pages"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages
      - id: deployment
        uses: actions/deploy-pages@v4

