name: Build Hina Desktop
on:
  workflow_dispatch:
  push:
    branches: [hina-desktop-v1, hina-input-qa-v1.0.1]
    paths:
      - 'desktop/**'
      - 'shared/hina/**'
      - '.github/workflows/hina-desktop.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run test:browser
      - run: npm run prepare:ui
      - name: Rust input lock and alpha mapping tests
        run: |
          rustc --test src-tauri/src/input.rs -o input-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\input-tests.exe
      - run: npm run build
      - run: npm run test:native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hina-qa-results
          path: desktop/qa-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: hina-desktop-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
