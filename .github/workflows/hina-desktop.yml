name: Build Hina Desktop
on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: 'Optional: rerun native QA using a previous executable (source must match)'
        required: false
        default: ''
        type: string
  push:
    branches: [main, hina-desktop-v1, hina-input-qa-v1.0.1, hina-remote-assets-v1]
    paths:
      - 'desktop/**'
      - 'shared/hina/**'
      - '.github/workflows/hina-desktop.yml'
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: node scripts/validate-asset-manifest.mjs
      - run: node scripts/validate-asset-manifest.mjs idle-manifest.json
      - run: npm test
      - run: npm run test:browser
      - run: npm run test:idle-browser
      - run: npm run prepare:ui
      - name: Rust input lock and alpha mapping tests
        run: |
          rustc --test src-tauri/src/input.rs -o input-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\input-tests.exe
      - name: Verify source of reused native executable
        if: inputs.reuse_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          if ($env:REUSE_RUN_ID -notmatch '^\d+$') { throw 'Invalid run ID' }
          $source = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:REUSE_RUN_ID" --jq '.head_sha'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch --depth=1 origin $source
          git diff --exit-code $source HEAD -- src scripts src-tauri ../shared/hina
          if ($LASTEXITCODE -ne 0) { throw 'Production sources differ from the reused executable' }
      - uses: actions/download-artifact@v4
        if: inputs.reuse_run_id != ''
        with:
          name: hina-native-test-executable
          path: desktop/src-tauri/target/release
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
        if: inputs.reuse_run_id == ''
      - uses: actions/upload-artifact@v4
        if: inputs.reuse_run_id == ''
        with:
          name: hina-desktop-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: inputs.reuse_run_id == ''
        with:
          name: hina-native-test-executable
          path: desktop/src-tauri/target/release/hina-desktop.exe
          retention-days: 7
      - name: Ensure WebView2 runtime for native executable QA
        run: |
          $runtime = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $runtime) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $install = Start-Process $installer -ArgumentList '/silent /install' -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "WebView2 runtime setup failed: $($install.ExitCode)" }
          }
      - run: npm run test:native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hina-qa-results
          path: desktop/qa-results/
          if-no-files-found: warn
