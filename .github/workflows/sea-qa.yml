name: Sea browser QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/sea-qa.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test runner
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile smoke tests
        run: npm run test:sea
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sea-qa-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
