<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>히나 비서</title><link rel="stylesheet" href="style.css"></head><body>
<button id="bubble" hidden></button><button id="pet" aria-label="히나 비서 · 클릭 MS 사무실 열기 / 드래그 이동"><img id="character" draggable="false" alt="히나 비서"><span id="asset-status"></span></button>
<section id="settings" hidden aria-label="히나 설정"><strong>MS 사무실 · 히나 설정</strong><label><input id="autostart" type="checkbox">자동 실행</label><label><input id="top" type="checkbox">항상 위</label><label><input id="roam" type="checkbox">자유 이동</label><label><input id="notifications" type="checkbox">QA 앱 알림</label><label>크기 <input id="size" type="range" min="140" max="240" step="10"></label><label>히나 Idle 검수 <select id="idle-motion"><option value="breathe">1. 기본 대기</option><option value="cheerful">2. 행복</option><option value="thinking">3. 생각</option><option value="surprised">4. 놀람</option><option value="greet">5. 인사</option><option value="explain">6. 설명</option><option value="note">7. 메모</option><option value="delighted">8. 기쁨</option></select></label><button id="close-settings">닫기</button><button id="exit">종료</button><p id="asset-update-status" role="status">에셋 확인 준비</p><p id="settings-error" role="alert"></p></section>
<script type="module" src="app.js"></script></body></html>
