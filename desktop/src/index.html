<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>히나 비서</title><link rel="stylesheet" href="style.css"></head><body>
<button id="bubble" hidden></button><button id="pet" aria-label="히나 비서 · 클릭 MS 사무실 열기 / 드래그 이동"><img id="character" draggable="false" alt="히나 비서"><canvas id="motion-canvas" width="512" height="614" hidden aria-label="히나 프레임 재생"></canvas><span id="asset-status"></span></button>
<section id="settings" hidden aria-label="히나 설정"><strong>MS 사무실 · 히나 설정</strong><label><input id="autostart" type="checkbox">자동 실행</label><label><input id="top" type="checkbox">항상 위</label><label><input id="roam" type="checkbox">자유 이동</label><label><input id="notifications" type="checkbox">QA 앱 알림</label><label>크기 <input id="size" type="range" min="140" max="240" step="10"></label><fieldset><legend>애니메이션 검수 · 시안</legend><label>모션 <select id="idle-motion"><option value="IDLE_NORMAL">01 기본 대기</option><option value="IDLE_HAPPY">02 행복</option><option value="IDLE_THINK">03 생각</option><option value="IDLE_SURPRISE">04 놀람</option><option value="IDLE_GREETING">05 인사</option><option value="IDLE_EXPLAIN">06 설명</option><option value="IDLE_NOTE">07 메모</option><option value="IDLE_CHEER">08 기쁨</option></select></label><p id="motion-info" role="status"></p><label><input id="motion-loop" type="checkbox">선택 모션 반복</label><div class="motion-actions"><button id="motion-pause">일시정지</button><button id="motion-reset">기본 대기 복귀</button><button id="motion-random">랜덤 시안 테스트</button></div><label><input id="compare-original" type="checkbox">원본과 비교</label><label><input id="motion-guides" type="checkbox">투명 격자 · 중심 · 발 기준선</label><button id="legacy-greeting">기존 인사 GIF</button><button id="motion-inspect">캐릭터 크게 검수</button><p>복원부와 동작 의미는 검수 전입니다. 시안은 직접 선택/랜덤 테스트에서만 재생됩니다. QA·걷기 상태가 우선합니다.</p></fieldset><p id="qa-connection" role="status">QA 연결 확인 중</p><button id="close-settings">닫기</button><button id="exit">종료</button><p id="asset-update-status" role="status">에셋 확인 준비</p><p id="settings-error" role="alert"></p></section>
<div id="inspection-bar" hidden><button id="inspect-next">다음 모션</button><button id="inspect-pause">재생/정지</button><button id="end-inspection">설정</button></div><script type="module" src="app.js"></script></body></html>
