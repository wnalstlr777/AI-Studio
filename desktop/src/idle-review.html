</style></head><body><main><p>HINA / ANIMATION REVIEW</p><h1>히나 8종 Idle · 검수 시안</h1><p>원본 픽셀 파츠를 공통으로 사용한 실제 WebP 프레임입니다. 눈·가려진 몸통은 복원 시안이며, 메모의 필기 동작과 관절·정렬은 추가 검수가 필요합니다. 승인 전 자동 배포하지 않습니다.</p><nav><select id="choose" aria-label="모션 선택"></select><button id="repeat" aria-pressed="false">반복</button><button id="pause">일시정지</button><button id="normal">기본 대기</button><button id="random">랜덤 검수 (6~15초)</button><button id="guides" aria-pressed="true">기준선</button></nav><p id="info" role="status"></p><div class="columns"><figure><div class="stage guides" id="stage"><img id="image" src="shared/hina/assets/secretary.png" alt="히나 모션"><canvas id="canvas" width="512" height="614" hidden></canvas></div><figcaption id="caption"></figcaption></figure><figure><div class="stage guides"><img src="shared/hina/assets/secretary.png" alt="수정하지 않은 원본 히나"></div><figcaption>원본 secretary.png · 변경 없음</figcaption></figure></div><p id="error" role="alert"></p><p>이 검수 페이지는 Windows 앱과 같은 MotionView 디코더·캔버스를 사용합니다. Tauri 입력과 Windows 실행 검수를 대신하지 않습니다.</p></main><script type="module" src="idle-review.js"></script></body></html>
