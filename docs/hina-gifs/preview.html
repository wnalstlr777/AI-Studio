<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>히나 공용 GIF 정렬 검수</title><style>body{margin:24px;background:#122333;color:#e8f2fa;font:16px system-ui}h1{font-size:24px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;max-width:1250px}figure{margin:0}img{display:block;width:100%;aspect-ratio:512/614;object-fit:contain;background:repeating-conic-gradient(#dce3e7 0% 25%,#b7c5ce 0% 50%) 0/20px 20px}figcaption{padding:12px 0}p{color:#bcced9;line-height:1.6}@media(max-width:700px){main{grid-template-columns:1fr}}</style><h1>히나 공용 GIF 3종 · 정렬 검수</h1><p>원본 8프레임과 동작을 보존했습니다. 출력 512×614, 중심 X=256(픽셀 반올림 ±1px), 발 Y=610.<br>손짓은 유지하고 모션마다 일정한 배율만 적용했습니다. IDLE 원본의 고개 움직임은 그대로 남아 있습니다. NEWS는 한 번 재생합니다. 다시 보려면 페이지를 새로고침하세요.</p><main><figure><img src="../../shared/hina/assets/hina-idle.gif" alt="대기 GIF"><figcaption>IDLE · 8프레임 · 1.76초 반복</figcaption></figure><figure><img src="../../shared/hina/assets/hina-alert.gif" alt="오류 GIF"><figcaption>ALERT · 8프레임 · 1.44초 반복</figcaption></figure><figure><img src="../../shared/hina/assets/hina-news.gif" alt="소식 GIF"><figcaption>NEWS · 8프레임 · 1.60초</figcaption></figure></main></html>
